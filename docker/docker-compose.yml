services:
  mtbackup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mikrotik-backup-bot
    container_name: mtbackup
    restart: unless-stopped
    environment:
      # required
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      # access control
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      TRUSTED_USERS: ${TRUSTED_USERS:-}
      # encryption key (empty = auto-generated in the data volume)
      FERNET_KEY: ${FERNET_KEY:-}
      # limits
      MAX_JOBS_PER_USER: ${MAX_JOBS_PER_USER:-5}
      MIN_INTERVAL_MINUTES: ${MIN_INTERVAL_MINUTES:-10}
      MAX_PARALLEL_BACKUPS: ${MAX_PARALLEL_BACKUPS:-3}
      ALLOW_PRIVATE_IPS: ${ALLOW_PRIVATE_IPS:-false}
      # automatic retry of a failed scheduled backup (RETRY_ATTEMPTS=0 disables it)
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-3}
      RETRY_DELAY_MINUTES: ${RETRY_DELAY_MINUTES:-5}
      # abuse protection
      TEST_LIMIT_PER_HOUR: ${TEST_LIMIT_PER_HOUR:-10}
      TARGET_LIMIT_PER_10MIN: ${TARGET_LIMIT_PER_10MIN:-5}
      CONN_FAIL_MIN_SECONDS: ${CONN_FAIL_MIN_SECONDS:-20}
      HIDE_CONN_ERRORS: ${HIDE_CONN_ERRORS:-auto}
    volumes:
      - mtbackup-data:/app/data

volumes:
  mtbackup-data:
